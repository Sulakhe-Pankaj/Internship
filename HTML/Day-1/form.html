<form action=""></form>
    <div align="center">
        <h2 > &hearts; Student Information form &hearts;</h2>
        <hr width="300px" color="black">
        <div>
            <label >
                User Name :  
                <input type="text" placeholder="Enter The Username">
            </label>
        </div>
        <br>
        <hr width="300px" color="black">
        <div>
            <label >
                Password :  
                <input type="password" placeholder="Password">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                Mobile No :  
                <input type="number" placeholder="Enter Mobile No">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                College Name :  
                <select name="College" id="name">
                    <option value="clg" selected>Select Your College</option>
                    <option value="clg">K.K.Wagh</option>
                    <option value="clg">D.Y.Patil</option>
                </select>
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                College Email Address :  
                <input type="email" placeholder="Enter Your Email">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                Stream :  
                <select name="Stream" id="stream">
                    <option value="stream" >Select Your Stream</option>
                    <option value="stream" selected>Engineering</option>
                    <option value="stream">Science</option
                    <option value="stream">ITI</option>
                </select>
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                Your Branch:  
                <input type="Branch" placeholder="Enter your Branch here">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                User DOB :  
                <input type="date" placeholder="Enter DOB">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label >
                I am 18 plus :  
                <input type="checkbox">
            </label>
        </div>
        <hr width="300px" color="black">
        <br>
        <div>
            <label>
                <b>Gender : </b>
                </label>
                <label for="Male ">Male</label>
                    <input id="Male" type="radio" name="male" value="male"> 
                <label for="FeMale ">Female</label>
                    <input id="Female" type="radio" name="male" value="female">
                <label for="FeMale ">Other</label>
                    <input id="Other" type="radio" name="male" value="Other">
        </div>
    </div>
</form>
