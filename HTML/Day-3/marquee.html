<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee tag in html</title>
</head>
<body>
    <marquee
     behavior="scroll" 
     direction="left"
     height="500px" 
     width="100%"
     bgcolor="yellow"
     scrollamount="50"
     >
        <h1>Welcome To Apana College</h1>
    </marquee>
</body>
</html>
