<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested list in html</title>
</head>
<body>
    <div>
        <ol>
            <li>chapter-1</li>
            <ul type="square">
                <li>Topic-1</li>
                <li>Topic-2</li>
                <li>Topic-3</li>
            </ul>
            <li>chapter-2</li>
            <ul type="square">
                <li>Topic-1</li>
                <li>Topic-2</li>
                <li>Topic-3</li>
            </ul>
        </ol>
    </div>
</body>
</html>
