<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Using Div Tag</title>
</head>
<body style="background-color: whitesmoke;">

    <!------------------------------------------------------------This is the  Main Part ----------------------------------------------------->
        
   <div style="width: 60%; height: 750px; background-color: white; margin: auto;" >

<!------------------------------------------------------------This is the  Header ----------------------------------------------------->
            <header>

                <div style="width: 100%; height: 100px; float: left; ">
                    <center><h1>Account Opening Form </h1></center>
                </div>

            </header>
<!------------------------------------------------------------This is the Body ----------------------------------------------------->
            <main>
                <form action="server" method="get">

                <div style=" background-color: white;  width: 45%; height: 550px; float: left; padding: 20px;">
                    <center><h2>Personal Information</h2></center>
                    <hr>
                    
                        <label for="name">Full Name</label><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="text" id="name" name="fullname" value="Mr" placeholder="Prefix" style="width: 75%; height: 25px;" ><br><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="text" id="name" name="fullname" placeholder="First Name" ><br><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="text" id="name" name="fullname"  placeholder="Last Name"><br><br>

                        <label for="dob">Date of Birth</label><br>
                        <input  style="width: 100%; height: 25px; border-radius: 5px;"type="date" id="dob" name="dob" placeholder="dd-mm-yy"><br><br>

                        <label for="m">Mother's Maiden Name</label><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="text" id="m" name="mother" placeholder="Mother's Maiden Name"><br><br>

                        <label for="t">Telephone Number</label><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="tel" id="t" name="mother" max="10" min="10" required placeholder="Enter a valid phone number"><br><br>

                        <label for="f">Email</label><br>
                        <input style="width: 100%; height: 25px; border-radius: 5px;" type="email" id="f" name="mail" required placeholder="example@gmail.com"><br><br>

                        <label for="q">Address</label><br>
                        <textarea style="width: 100%; height: 25px; border-radius: 5px;" name="address" rows="4" cols="30" name="address" placeholder="Enter your address here..." id="q" style="height: 30px;"></textarea>
                    
                </div>

            </main>
<!------------------------------------------------------------ This is the Footer ----------------------------------------------------->
            <footer>

            <div style="width: 45%; height: 550px;float: right; padding: 20px;">
                <legend style="text-align: left;"><h2>Account Details</h2></legend><hr>

                <label for="accountType">Account Type:</label><br>
                <select id="accountType" name="accountType" required style="width: 100%; height: 30px; border-radius: 5px;">
                    <option value="">Select Account Type</option>
                    <option value="savings">Savings Account</option>
                    <option value="current">Current Account</option>
                    <option value="fixed">Fixed Deposit Account</option>
                </select><br><br>

                <label>Account Category:</label><br>
                <select id="accountCategory" name="accountCategory" required style="width: 100%; height: 30px; border-radius: 5px;">
                    <option value="">Select Category</option>
                    <option value="individual">Individual</option>
                    <option value="joint">Joint</option>
                    <option value="corporate">Corporate</option>
                </select><br><br>

                <label for="monthlySalary">Monthly Salary (IN USD):</label><br>
                <input type="number" id="monthlySalary" name="monthlySalary" placeholder="Enter your monthly salary" required style="width: 100%; height: 25px; border-radius: 5px;"><br><br>

                <label for="date">Date:</label><br>
                <input type="date" id="date" name="date" required style="width: 100%; height: 20px; border-radius: 5px;"><br><br>

                <label for="city">City:</label><br>
                <input type="text" id="city" name="city" placeholder="Enter your city" required style="width: 100%; height: 25px; border-radius: 5px;"><br><br>

                <label for="State/Proviance">State/Proviance:</label><br>
                <input type="text" id="State/Proviance" name="State/Proviance" placeholder="Enter your state/province" required style="width: 100%; height: 25px; border-radius: 5px;">
            </div>
                <input type="Submit"style="width:90%; height:30px; border-radius:5px; display:flex; margin: auto; background-color: #4CAF50; color: white;"> 
            </footer>
            </form>
        </div>
        <center>
        <h1 style="color: black"><b style="font-family: 'Great Vibes', cursive;">Made With <b style="color: #AD1457;">&hearts;</b> <b>By Pankaj Sulakhe</b></h1>
        </center>
    <!-- </center> -->
</body>
</html>
