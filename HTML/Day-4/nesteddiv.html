    </html><center><h1>This is the Nested Div Tag in HTML</h1></center>

            <div style="width: 33.33%; height: 25%; float:left; background-color:rgb(248, 4, 4);"></div>
            <div style="width: 33.33%; height: 25%; float:left; background-color: rgb(126, 142, 60);"></div>
            <div style="width: 33.33%; height: 25%; float:left; background-color: rgb(175, 11, 235);"></div>
            <div style="width: 33.33%; height: 25%; float:left; background-color:black;"></div>
            <div style="width: 33.33%; height: 25%; float:left; background-color: blue;"></div>
            <div style="width: 33.33%; height: 25%; float:left; background-color: rgb(220, 240, 162);"></div>
        </div>
        <div style="height: 50%; width: 50%; float: left; background-color:black ;"></div>
        <div style="height: 50%; width: 50%; float: left; background-color:white ;"></div>
        <div style="height: 50%; width: 50%; float: left; background-color:pink ;"></div>
    </div>
