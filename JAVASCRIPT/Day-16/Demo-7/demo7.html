    <script>
        // Q-1: Print numbers from 1 to 10 using while loop.
        i = 1;
        while (i <= 10) {
            document.write('<br>' + i)
            i++;
        }

        document.write('<br>')
        document.write('<br>')

        // Q-2: Print even numbers from 2 to 20 using while loop.
        j = 2;
        while (j <= 20) {
            document.write('<br>' + j)
            j += 2
        }

        document.write('<br>')
        document.write('<br>')

        // Q-3: Print the reverse numbers from 10 to 1 using while loop.
        k = 10;
        while (k >= 1) {
            document.write('<br>' + k)
            k--
        }

        document.write('<br>')
        document.write('<br>')

        // Q-4: Calculate the sum of numbers from 1 to 100 using while loop.

            l++
        }
