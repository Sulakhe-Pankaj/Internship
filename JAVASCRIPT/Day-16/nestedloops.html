<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        i =1;
        while(i <=30){
            document.write("<h1>"+i+"</h1>")
            var j =1
            while(j<=10){
                if(i+1){
                    var c = j * i
                document.write("<br>"+c)
                }
                j++
            }
            i++;
        }
    </script>
</body>
</html>
