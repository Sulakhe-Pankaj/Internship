<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0px;
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100%;
            align-items: center;
        }

        h1 {
            margin-top: 0px;
        }

        .box1 {
            width: 330px;
            height: 150px;
            background-color: rgb(211, 211, 211);
            box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.5);
            text-align: center;
            border-radius: 10px;
        }

        .box1 input {
            width: 42%;
            height: 20px;
        }

        #kmt,
        #mt {
            width: 44%;
            height: 23px;
            color: red;
        }
    </style>
</head>

<body>
    <div class="box2" style="position: absolute;top: 240px;"><h1>Pankaj Sulakhe</h1></div>
    <br>
    <br>
    <div class="box1">
        <h1 style="text-align: center;">Convertor</h1>
        <span id="input_box">
            <input type="text" id="inp" onkeyup="convertor()"> = <input type="text" id="display" readonly>
        </span><br>
        <br>
        <span>
            <select name="" id="kmt" onchange="convertor()">
                <option value="Kilometer">Kilometer</option>
                <option value="Meter">Meter</option>
            </select>&nbsp;&nbsp;&nbsp;&nbsp;
            <select name="" id="mt" onchange="convertor()">
                <option value="Meter">Meter</option>
                <option value="Kilometer">Kilometer</option>
            </select>
        </span>
    </div>
    <script>
        function convertor() {
            var value = document.getElementById('inp').value;
            var i = document.getElementById('kmt').value;
            var ii = document.getElementById('mt').value;

            if (i == 'Kilometer' && ii == 'Meter') {
                var km = document.getElementById('inp').value;
                var output = Number(km) * 1000;
                document.getElementById('display').value = output;
            }

            else if (i == 'Meter' && ii == 'Kilometer') {
                var m = document.getElementById('inp').value;
                var output = Number(m) / 1000;
                document.getElementById('display').value = output;
            }
            else if (i == ii || ii == i) {

                var km = document.getElementById('inp').value;
                var output = (km);
                document.getElementById('display').value = output;
            }
        };
    </script>
</body>

</html>
