<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body id="body" onkeypress="press1()" onkeydown="down1()" onkeyup="up1()">
    <script>
        function press1(){
            document.getElementById('body').style.backgroundColor="red"
        }
        function down1(){
            document.getElementById('body').style.backgroundColor="green"
        }
        function up1(){
            document.getElementById('body').style.backgroundColor="yellow"
        }
    </script>

    <br>
    <br>
    <input type="text" placeholder="rate" id="rate" onkeyup="cal()" ><br><br>
    <input type="text" placeholder="qut" id="qut" onkeyup="cal()"><br><br>
    <input type="text" placeholder="total" id="total" readonly ><br><br>
    <script>
        function cal(){
            var a = document.getElementById('rate').value;
            var b = document.getElementById('qut').value;
            var c = Number(a) * Number(b);
            document.getElementById('total').value = c;
        }
    </script>
    <form action="save.html" onsubmit="return confirm ('are you sure...')">
        <input type="text" id="name" onfocus="focus1()">
        <input type="text" id="email" onblur="blur()">
        <input type="text" id="phone" onselect="select1()">
        <button id="submit1" type="submit" >Submit</button>
        <script>
            function focus1(){
                document.getElementById('name').style.backgroundColor = 'red'
            }
            function blur(){
                document.getElementById('email').style.backgroundColor = 'yellow'
            }
            function select1(){
                document.getElementById('phone').style.backgroundColor = 'green'
            }
        </script>
    </form>
</body>
</html>
