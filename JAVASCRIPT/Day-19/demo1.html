<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
}

.menu {
    display: flex;
    width: 100%;
    height: 100px;
    background-color: blue;
    gap: 50px;
    justify-content: center;
    align-items: center;
}

.button {
    width: 120px;
    height: 50px;
    color: white;
    background-color: black;
    border: 1px solid white;
    font-weight: bold;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="menu">
    <button class="button" onclick="activate(0)">Home</button>
    <button class="button" onclick="activate(1)">About</button>
    <button class="button" onclick="activate(2)">Service</button>
    <button class="button" onclick="activate(3)">Blog</button>
    <button class="button" onclick="activate(4)">Contact</button>
</div>

<script>
function activate(i) {
    let btn = document.getElementsByClassName("button");

    btn[0].style = "background:black;color:white;";
    btn[1].style = "background:black;color:white;";
    btn[2].style = "background:black;color:white;";
    btn[3].style = "background:black;color:white;";
    btn[4].style = "background:black;color:white;";

    btn[i].style = "background:yellow;color:black;";
}
</script>

</body>
</html>
