    <script>
        // keyword name = value
        // variable declearation
        // for example var andskj=123
        // multiple time we call one variable in js 
        // var a = 1;
        // var b = a + b;
        // call this variable
        // document.write(c)

        // types of keyword in js
        
        // 1. var -> global
        var a = 100;
        if (true){
            var  a = 200;
            document.write(a);
        }
        document.write( "<br>",a);
        // 2. let -> local
        let b = 100;
        if (true){
            let  b = 200;
            document.write('this is the local variable or keyword : ','<br>', b);
        }
        document.write( 'this is the local variable or keyword :' ,  b);
        // 3. const -> unic
        const demo="pankaj sulakhe"

    </script>
