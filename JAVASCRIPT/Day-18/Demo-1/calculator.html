<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://kit.fontawesome.com/83ee16473a.js" crossorigin="anonymous"></script>
    <style>
        body {
            width: 100%;
            height: 740px;
            background: linear-gradient(45deg, rgb(62, 59, 59), rgb(33, 30, 25));
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .cal {
            width: 300px;
            padding: 10px;
            height: 500px;
            /* background-color: red; */
            border: 3px solid black;
            box-shadow: 0px 3px 20px 1px black;
            border-radius: 15px;

        }

        .display_ans {
            color: whitesmoke;
            width: 100%;
            height: 75px;
            background-color: transparent;
            border-radius: 15px;
            box-shadow: -1px 3px 5px 1px rgb(62, 59, 59);
        }

        .buttons {
            width: 100%;
            margin-top: 30px;
            height: 390px;
            /* background-color: blue; */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .inputs {
            border: none;
            border-radius: 50%;
            font-size: large;
            font-weight: bold;
            background-color: transparent;
            color: whitesmoke;
            box-shadow: 0px 3px 5px 1px rgb(62, 59, 59);
        }

        input {
            all: unset;
        }

        .inputs:hover {
            background-color: rgb(62, 59, 59);
            box-shadow: 0px 3px 5px 1px rgba(62, 59, 59, 0.5);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="cal">
        <div class="display_ans">
            <input type="text" readonly id="display"
                style="width: 90%; height: 50px; margin-top: 10px;margin-left: 12px; border: none; font-size: 30px;">
        </div>
        <div class="buttons">
            <button class="inputs" onclick="cleardisplay()">C</button>
            <button class="inputs" onclick="back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="inputs" onclick="append('/')">/</button>
            <button class="inputs" onclick="append('%')">%</button>
            <button class="inputs" onclick="append('7')">7</button>
            <button class="inputs" onclick="append('8')">8</button>
            <button class="inputs" onclick="append('9')">9</button>
            <button class="inputs" onclick="append('*')">*</button>
            <button class="inputs" onclick="append('4')">4</button>
            <button class="inputs" onclick="append('5')">5</button>
            <button class="inputs" onclick="append('6')">6</button>
            <button class="inputs" onclick="append('-')">-</button>
            <button class="inputs" onclick="append('1')">1</button>
            <button class="inputs" onclick="append('2')">2</button>
            <button class="inputs" onclick="append('3')">3</button>
            <button class="inputs" onclick="append('+')">+</button>
            <button class="inputs" onclick="append('0')">0</button>
            <button class="inputs" onclick="append('00')">00</button>
            <button class="inputs" onclick="append('.')">
                <i class="fa-solid fa-circle" style="font-size: 5px;"></i>
            </button>
            <button class="inputs" onclick="equal()">=</button>
        </div>
    </div>
    <script>
        function append(value) {
            document.getElementById("display").value += value;
        }1
        function cleardisplay() {
            document.getElementById("display").value = "";
        }
        function equal() {

            var exp = document.getElementById('display').value;
            document.getElementById('display').value = eval(exp);
        }
        function back(){
            var b =document.getElementById('display').value;
            document.getElementById('display').value = b.slice(0 , -1);
        }

    </script>
</body>

</html>
