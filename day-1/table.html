<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in html</title>
</head>
<body>
    <table width="300px" align="center" border="black">
        <thead>
            <tr>
                <th rowspan="2">Item</th>   
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>INR</th>   
                <th>USD</th>
            </tr
        </thead>
        <tbody>
        </tbody>
        <tr>
            <td>Apple</td>
            <td>80</td>
            <td>1</td>
        </tr>
        <tr>
            <td>Mango</td>
            <td>160</td>
            <td>2</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>120</td>
            <td>1.5</td>
        </tr>
        <tr>
            <td>Book</td>
            <td>160</td>
            <td>2</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>1600</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>160000</td>
            <td>200</td>
        </tr>
    </table>
</body>
</html>
