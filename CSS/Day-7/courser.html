<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courser</title>
    <style>
        .c{
            width: auto;
            height: auto;
        }
        #a{
            height: 50px;width: 100px;
            cursor: move;
        }
        #f{
            height: 50px;width: 100px;
            cursor: not-allowed;
        }
        #c{
            height: 50px;width: 100px;
            cursor: pointer;
        }
        #d{
            height: 50px;width: 100px;
            cursor: help;
        }
        #e{
            height: 50px;width: 100px;
            cursor: wait;
        }
        #b{
            height: 50px;width: 100px;
            cursor: text;
        }
    </style>
</head>
<body>
    <div class="c">
        <button id="a" > move</button>
        <button id="b" > text</button>
        <button id="c" >pointer</button>
        <button id="d" >help</button>
        <button id="e" >wait</button>
        <button id="f" >disable</button>
    </div>
</body>
</html>
