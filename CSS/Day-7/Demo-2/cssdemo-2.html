<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design</title>
    <style>
        .A{
            width: 100%;height: 750px;background-color: yellow;
            display: block;
            /* border-top: 5px solid black;
            border-right: 5px solid black; */
        }
        .B{
            width: 100%;height: 120px;background-color:yellow;
        }
        .C{
            height: 100%;width: 10%;background-color: yellow;float: left;
            border-top: 5px solid black;
            border-right: 5px solid black;
        }
        .D{
            height: 100%;width: 10%;background-color: yellow;float:right;
            border-top: 5px solid black;
            border-left: 5px solid black;
        }
        .R{
            width: 100%;height: 120px;

        }
        .G{
            height: 95%;width: 10%;background-color: yellow;float: left;
            border-top: 5px solid black;
            border-right: 5px solid black;
        }
        /* .V{
            width: 40%;height: 95%;background-color: red;
        } */
        .N{
            height: 113px;width: 112px;background-color: yellow;float: left;
            border-top: 5px solid black;
            border-left: 5px solid black;
        }
        .O{
            width: 40%;height: 94%;background-color: yellow;float: left;
            border-bottom: 5px solid black;
        }
        .god{
            width: 300px;height: 300px;background-color: aqua;float: left;
            margin-top: 35px; margin-left: 30px;
            border: 7.5px solid blue;
            outline: 5px solid darkblue;
        }
        #image{
            margin-left: 30px;
        }

    </style>
</head>
<body>
    <div class="A">
        <div class="B"><img src="image3.png" alt="" height="120px"><img src="image3.png" alt="" height="100%" style="margin-left: 875px;">
            <div class="C"></div>
            <div class="D"></div>
        </div>
        <div class="B"><img src="image3.png" alt="" height="120px"><img src="image3.png" alt="" height="100%" style="margin-left: 597px;">
            <div class="C"></div>
            <div class="D"></div>
        </div>
        <div class="R">
            <div class="G"> </div>
            <div class="O"> <img id="image" src="image3.png" alt="" height="100%"><img id="image" src="image3.png" alt="" height="100%"><img id="image" src="image3.png" alt="" height="100%"><img id="image" src="image3.png" alt="" height="100%"></div>
            <div class="N"></div>
        </div>
        <div class="god"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnKX1nQEUMi2kB9LSGIVra6z7ZIYIFp7ecfA&s" height="100%" width="100%" alt=""></div>
        <div class="god"> <img src="https://thumbs.dreamstime.com/b/square-frame-beautiful-nature-scenery-close-up-dandelion-against-cloudy-blue-sky-white-flower-blooms-amid-green-154769697.jpg" height="100%" width="100%" alt=""></div>
        <div class="god"> <img src="https://img.freepik.com/free-photo/aerial-view-colorful-mixed-forest-shrouded-morning-fog-beautiful-autumn-day_1153-3817.jpg" height="100%" width="100%" alt=""></div>
        <div class="god"> <img src="https://www.reconnectwithnature.org/getmedia/5c950d19-906a-4c55-acce-59aeacdd9ddb/Hadley-Valley-sunset-Joe-McGuire-July-2022.jpg?width=1500&height=1221&ext=.jpg" height="100%" width="100%" alt=""></div>
    </div>
</body>
</html>
