<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float&clear</title>
    <style>
        .box{
            /* display: flex; */
            gap: 10px;
            /* background-color: red; */
            width: 100%;
            height: 100%;
        }
        .box1{
            height: 500px;width: 500px;float: left;
            background-color: aqua;
            opacity: 20%;
            /* margin: 10px; */
            
        }
        .box2{
            height: 500px;width: 600px; 
            background-color: black;clear: both;
            opacity: 20%;

        }

    </style>
</head>
<body>
    <div class="box">
    <div class="box1"></div>
    <div class="box1" style="float:left; background-color: blue;"></div>
    <div class="box2"></div>

    </div>
</body>
</html>
