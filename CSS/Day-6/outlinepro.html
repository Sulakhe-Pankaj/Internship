<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline Property in css and radous property</title>
    <style>
        .box{
            height: 400px;width: 25%;float: left;background-color: yellow;
            border: 10px solid red;
            outline: 5px solid black;
            outline-offset: 5px;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .b{
            height: 50%;width: 50%;float: left;background-color: yellow;
            border: 10px solid red;
            outline: 5px solid black;
            outline-offset: 5px;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box">
        <div class="b"></div>
    </div>
    <div class="box">
        <div class="b"></div>
    </div>
    <div class="box"></div>
</body>
</html>
