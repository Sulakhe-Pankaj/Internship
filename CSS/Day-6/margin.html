<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin in css</title>
    <style>
        .box{
            height: 400px;width: 400px;float: left;background-color:black;
            padding-left: 50px;
            padding-top: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
            padding: 50px;
            /* padding increase space inside the box */
            margin-left: 50px;
            margin-top: 50px;
            margin-right: 50px;
            margin-bottom: 50px;
            margin: 50px;
            /* margin increase space from outside the box and sift the loacation of box */
        }
        #text{
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3 id="text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Dignissimos quia autem ipsa recusandae saepe minus asperiores velit, reprehenderit, ullam eaque cumque modi, iste corporis hic in cum nobis tenetur sint?
        </h3>
    </div>
</body>
</html>
