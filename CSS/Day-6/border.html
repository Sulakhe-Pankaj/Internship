<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border CSS</title>
    <style>
        .box{
            width: 500px; height: 500px; float: left;
            background-color: yellow;
            border: 10px dotted red;
            border-top: 20px solid green;
            border-right: 20px solid blue;
            border-bottom: 20px solid violet;
            border-left: 20px solid greenyellow;
            border-radius: calc(900px);

            
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
