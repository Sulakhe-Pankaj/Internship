<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo-12</title>
    <style>
        .box{
            width: 100%;
            height: 600px;
            display: flex;
            margin-bottom:100px;
            /* overflow-y: hidden; */
            position: fixed;
        }
        .circle{
            width: 75px;
            height: 75px;
            background-color: black;
            border-radius: 50%;
            animation-name: ani;
            animation-duration: 15s;
            /* animation-timing-function: linear; */
            animation-iteration-count: infinite;
            position: relative;

        }
        @keyframes ani{
            0%{
                top: 0%;
                left: 0%;
            }
            6.250%{
                top: 100%;
                left: 0%;
            }
            12.50%{
                top: 100%;
                left: 12.50%;
            }
            18.75%{
                top: 0%;
                left: 12.50%;
            }
            25%{
                top: 0%;
                left: 25%;
            }
            31.25%{
                top: 100%;
                left: 25%;
            }
            37.50%{
                top: 100%;
                left: 37.50%;
            }
            43.75%{
                top: 0%;
                left: 37.50%;
            }
            50%{
                top: 0%;
                left: 50%;
            }
            56.25%{
                top: 100%;
                left: 50%;
            }
            62.50%{
                top: 100%;
                left:62.50%;
            }
            68.75%{
                top: 0%;
                left:62.50%;
            }
            75%{
                top: 0%;
                left:75%;
            }
            81.25%{
                top: 100%;
                left:75%;

            }
            87.50%{
                top: 100%;
                left: 87.50%;
            }
            93.75%{
                top: 0%;
                left: 87.50%;
            }
            100%{
                top: 0%;
                left: 100%;
            }
            
        }
    </style>
</head>
<body bgcolor="yellow">
    <div class="box">
        <div class="circle"></div>
    </div>
</body>
</html>
