<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 7</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .box{
            width: 100%;height: 660px;background-image: url(image1.avif);
            background-size: cover;
            border-right: 2px solid whitesmoke;
            /* position: absolute; */
            top: 75px;
            /* left: 70px; */
            display: flex;
            

        }
        .box1{
            width: 100%;
            height: 650px;
            background:rgba(6, 0, 5, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
            margin: 5px;
            display: flex;
            gap:60px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
        }
        .b1{
            width: 25%;
            height: 85%;
            float: left;
            position: relative;
            /* top: 10px; */
            left: 25px;
            bottom: 50px;
            border-radius: 25px;
            padding-left: 10px;
            padding-right: 15px;
        }
        .b2{
            width: 25%;
            height: 90%;
            background-image:url(image2.jpg);float: left;
            background-size: cover;
            position: relative;
            top: 20px;
            left: 35px;
            border-radius: 25px;
            border: 5px solid black;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }
        .b3{
            width: 27%;
            height: 85%;
            background-color: rgb(1, 1, 15);float: left;
            position: relative;
            top: 25px;
            left: 60px;
            border-radius: 25px;
            border-left: 2.5px solid red;
            border-right: 2.5px solid red;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 50px;
            /* font-size: 27px; */

            font-weight: bold;
            color: whitesmoke;
        }
        .box1 h1{
            text-align: center;
            font-size: 100px;color: whitesmoke;
            line-height: 120px;
            font-weight: bold;
            text-shadow: 2px 1px 0 #6a0dad, 2px 1px 0#7b1fa2,5px 5px 0 #8e24aa, 5px 5px 5px rgba(0,0,0,1); display: block;
        }
        .b2 h2{
            font-size: 60px;
            text-align: center;
            color: rgb(231, 58, 58);
            margin: 0px;
        }
        .camera{
            width: 25px;height: 25px;background-color: black;
            position: sticky;
            left: 45%;
            border-radius: 50%;
        }
        input{
            width: 60%;height: 25px;
            border-radius: 50px;
        }
        .apps{
            width: 75%;height: 255px;position: absolute;
            left: 45px;bottom: 75px;display: block;
        }
        .app{
            width: 75px;height: 75px;background-image: linear-gradient(135deg,red, yellow);float: left;
            margin: 5px;box-shadow: 0 0 4px rgba(5, 0, 0, 1);border-radius: 15px;
        }
        #a{
            position: relative;top: 25px;font-size: 27px;
        }
    </style>
</head>
<body style="background-color: black;">
    <div class="box">
        <div class="box1">
            <div class="b1">
                <h1>A2Z Infotechs Mobile Order System</h1>
            </div>
            <div class="b2">
                <div class="camera"></div>
                <ion-icon name="battery-full-outline" style="font-size: 30px; color: whitesmoke; position: relative; left: 90%; bottom: 30px;; display: block;"></ion-icon>
                <h2>11:00PM</h2>
                <label><span style="position: relative;top: 26.5px;left: 250px;"><ion-icon name="search-outline" style="color: black; font-size: 15px;"></ion-icon></span>
                <center><input type="text" placeholder="&nbsp;&nbsp;&nbsp;Search"></center>
                </label>
                <div class="apps">
                    <div class="app"><ion-icon name="logo-facebook" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-google" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-google-playstore" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-github" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-tiktok" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-twitter" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-twitter" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-youtube" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                    <div class="app"><ion-icon name="logo-linkedin" style="width: 100%;height: 75%;color: whitesmoke;text-align: center;margin-top: 10px;"></ion-icon></div>
                </div>
                <span style="position: absolute;top: 500px;left: 120px;"><ion-icon name="remove-outline" style="font-size: 100px;color: whitesmoke"></ion-icon></span>
            </div>
            <div class="b3">
                <span id="a">OREDER NOW</span><br><br>
                <form action="server">
                <input type="text" required style="width: 90%;height: 40px; font-size: 18px; line-height: 25px;text-align: center; border-left: 3px solid red; border-right: 3px solid red; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); margin-top: 15px;" placeholder="Enter Full Name">
                <input type="email" required style="width: 90%;height: 40px; font-size: 18px; line-height: 25px;text-align: center; border-left: 3px solid red; border-right: 3px solid red; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); margin-top: 15px;" placeholder="Enter Email">
                <input type="number" max="10" min="10" required style="width: 90%;height: 40px; font-size: 18px; line-height: 25px;text-align: center; border-left: 3px solid red; border-right: 3px solid red; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); margin-top: 15px;" placeholder="Enter Mobile"> 
                <input type="number" required style="width: 90%;height: 40px; font-size: 18px; line-height: 25px;text-align: center; border-left: 3px solid red; border-right: 3px solid red; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); margin-top: 15px;" placeholder="Enter Price">
                <br>
                <textarea name="" required id="" cols="5" rows="3" placeholder="Enter your address..." style="width: 90%;height: 70px; text-align: center;border-radius: 20px; margin-top: 20px; " ></textarea>
                <br>
                <button type="submit" style="height: 35px; border-radius: 10px; width: 100px; border: 2.5px solid black; background-color: red;color: whitesmoke; box-shadow: 0 0 5px rgba(54, 52, 52, 0.9); margin-top: 15px;">Order Now</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
