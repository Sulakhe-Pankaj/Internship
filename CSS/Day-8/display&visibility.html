<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display&visibility</title>
        <style>
            ul li{
                display: inline;
                margin-left: 100px;
                font-size: 30px;
            }
            .box1{
                height: 200px;width: 100%;background-color: green;
                visibility:hidden ;
            }
            .box2{
                height: 200px;width: 100%;background-color: red;
                visibility:visible ;
            }
        </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <li>Home</li>
        <li>Home</li>
        <li>Home</li>
    </ul>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
