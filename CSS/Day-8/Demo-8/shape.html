<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape</title>
    <style>
        .box{
            width: 100%;height: 700px;background-color: white;
            display: flex;
        }
        .box1{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 50px;
            top: 50px;
            border:5px solid white;
        }
        .box2{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 130px;
            top: 130px;
            border:5px solid white;
        }
        .box3{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 210px;
            top: 210px;
            border:5px solid white;
        }
        .box4{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 290px;
            top: 290px;
            border:5px solid white;
        }
        .box5{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 370px;
            top: 370px;
            border:5px solid white;
        }
        .box6{
            height: 130px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 450px;
            top: 450px;
            border:5px solid white;
        }
        .box7{
            height: 100px;width: 100px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 540px;
            top: 370px;
            border:5px solid white;
        }
        .box8{
            height: 200px;width: 200px; background: linear-gradient(135deg, red, blue);
            position: absolute;
            left: 625px;
            top: 190px;
            border:5px solid white;
            z-index: 1111;
        }
        .box9{
            height: 300px;width: 300px; background: linear-gradient(315deg, red, blue);
            position: absolute;
            left: 700px;
            top: 50px;
            border-radius: 50%; 

        }
        .box10{
            height: 25px;width: 400px; background: linear-gradient(90deg, red,blue ) ;
            position: absolute;
            left: 800px;
            top: 110px;
            border: 5px solid white;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
        <div class="box8"></div>
        <div class="box9"></div>
        <div class="box10"></div>

    </div>
</body>
</html>
