<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .container{
            width: 100%;
            /* height: auto; */
            display: grid;
            /* grid-template-columns:100%; */
            /* grid-template-rows: auto; */
          grid-template-areas:
            "header header"
            "sidebar main"
            "footer footer";
            gap: 10px;
        }
        .header{
            grid-area: header;
            width: 100%;
            height: 150px;
            background-color: yellow;
        }
        .main{
            width: 100%;
             height: 100px;
            background-color: green;
            grid-area: main;
        }
        .sidebar{
            grid-area: "sidebar";
            width: 100%;
            height: auto;
            background-color: red;
        }
        .footer{
            width: 100%;
            height: 150px;
            background-color: pink;
            grid-area: footer;
        }

    </style>
</head>
