<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }

        .whole_page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 782px;
            width: 100%;
            margin: 0px;
            padding: 0px;
            float: left;
            background-color: black;
            background-size: cover;
        }

        #heading {
            color: aliceblue;
        }

        .signup_page {
            width: 280px;
            height: 450px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0px 10px 0px 10px;
            float: left;
            box-shadow: 0px 0px 20px 2px rgba(255, 255, 255, 0.4);
            /* color:whitesmoke; */
        }

        #email,
        #pass,
        #user {
            width: 100%;
            border: none;
            height: 30px;
            background-color: rgba(150, 140, 140, 0.5);
            padding: 0px;
            margin: 0px;
            all: unset;
        }

        input::placeholder {
            color: rgb(242, 234, 234);
            font-size: large;
        }

        .email_field {
            margin-top: 45px;
            font-size: 20px;
            color: whitesmoke;
        }

        .email_field hr {
            margin: 0px;
        }

        .button {
            width: 100%;
            height: auto;
            /* background-color: aqua; */
            position: relative;
            /* left: 125px; */
            top: 45px;
        }

        #button {
            width: 100%;
            height: 40px;
            background-color: blue;
            color: whitesmoke;
            font-size: large;
            font-weight: bold;
            border: none;
            opacity: 80%;
            border-radius: 30px;
            box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.5);
        }

        #button:hover {
            opacity: 90%;
            color: blue;
            filter: drop-shadow(2px 2px 6px gray);
            background-image: linear-gradient(135deg, orange, whitesmoke, green);
            cursor: pointer;

        }

        .create_account {
            width: 80%;
            padding: 10px 10%;
            height: auto;
            position: relative;
            top: 70px;
            text-align: center;
        }

        .create_account a {
            text-decoration: none;
            color: rgb(255, 255, 255);
            font-size: large;
            font-weight: 450;
            opacity: 75%;
        }

        .create_account a:hover {
            color: rgb(238, 54, 54);
            text-decoration: underline;
            opacity: 100%;
        }
    </style>
</head>

<body>
    <div class="whole_page">
        <div class="signup_page">
            <center>
                <h1 id="heading">Sign Up</h1>
            </center>
            <form action="/signup" method="POST">
                <div class="email_field">
                    <input type="text" id="user" name="username" placeholder="Username" required>
                    <hr>

                </div>
                <div class="email_field">

                    <input type="email" id="email" name="email" placeholder="Email" required>
                    <hr>
                </div>
                <div class="email_field">

                    <input type="password" id="pass" name="password" placeholder="Password" required>
                    <hr>
                </div>
                <div class="button">
                    <button type="submit" id="button">Sign Up</button>
                </div>
            </form>
            <div class="create_account">
                <a href="/login">Already have account? Login</a>
            </div>
        </div>
    </div>
</body>

</html>
