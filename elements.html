<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width: 325px;
            height: 325px;
            background-color: whitesmoke;
            position: relative;
            overflow: auto;
            border-radius: 10px;
        }

        .card h3{
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 275px;
            display: block;
        }

        .action-button {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            width: 60px;
            height: 60px;
            opacity: 0;
            transition: 0.5s ease-in-out;
        }

        .card:hover .action-button {
            opacity: 1;
        }

        .action-button button {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: none;
            background: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        .action-button button::before {
            content: 'View';
            color: green;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .action-button button:hover::before {
            font-size: 18px;
            color: darkgreen;
        }

        /* ====================================== */
        .modal {
            position: fixed;
            inset: 0;
            width: 100%;
            height: auto;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .img-info {
            width: auto;
            height: auto;
            background: whitesmoke;
            border-radius: 20px;
            overflow: scroll;
            padding: 25px;
            margin-top: 25px;
           box-shadow: 0px 0px 10px 5px rgba(218, 215, 215, 0.5);
        }

        .img-info img {
            box-shadow: 0px 0px 20px 5px rgba(28, 27, 27, 0.5);
             transition: 0.3s;
        }

        .img-info img:hover{
            transform: scale(1.01, 1.01);
        }

        .txt-info {
            position: relative;
            width: 320px;
            padding: 0px 15px 15px 15px;
            float: left;
            height: auto;
            /* background-color: aqua; */
        }

        .txt-info p{
            text-align: justify;
            font-size: large;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

        }

        .modal img {
            width: 350px;
            height: 300px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .modal h2 {
            color: black;
            padding-left: 100px;
            font-size: 24px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="z-dairy-website/Images/icecream.jpg" id="img">
        <h3 data-en="Ice Cream" data-mr="आईस्क्रीम">Ice Cream</h3>
        <div class="action-button" onclick="click1()"><button type="button"></button></div>
    </div>
    <div class="modal" id="viewModal">
        <span class="close" onclick="closeModal()">×</span>
        <div class="img-info">
            <img id="modalImg" title="Ice Cream">
            <h2 id="modalTitle" style="cursor: pointer;"></h2>
            <div class="txt-info">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.

                </p>
            </div>
        </div>
    </div>
    <script>
        function click1() {
            const imgSrc = document.getElementById("img").src;
            const title = document.querySelector(".card h3").innerText;

            document.getElementById("modalImg").src = imgSrc;
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("viewModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("viewModal").style.display = "none";
        }
    </script>


</body>

</html>
