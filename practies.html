<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #0e1538;
        }
        .outer{
            width: 300px;
            height: 400px;
            position: absolute;
            border-radius: 20px;
            left: 500px;
            top: 150px;
            background-color: black;
            overflow: hidden;
        }

        .design{
            height: 550px;
            width: 150px;
            position: relative;
            left: 50px;
            bottom: 60px;
            background: linear-gradient(200deg , violet , skyblue );
            animation: ani 0.03s linear 0s infinite;
        }
        @keyframes ani{
            0%{transform: rotate(0deg);}
            25%{transform: rotate(90deg);}
            50%{transform: rotate(180deg);}
            75%{transform: rotate(270deg);}
            100%{transform: rotate(360deg);}
        }
        .inner{
            width: 290px;
            height: 390px;
            background-color: #0e1538;
            position: absolute;
            top: 5px;
            left: 5px;
            border-radius: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            
        </div>
        <div class="design"></div>
    </div>
</body>
</html>
